[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-code-review"
version = "0.1.0"
description = "AI-powered code review tool for validating AI-generated code in PRs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
all = ["openai>=1.0.0"]

[project.scripts]
ai-code-review = "code_review.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
